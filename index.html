    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root {
            --bg-primary: #f7f8fa;
            --bg-secondary: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --accent-primary: #16a34a;
            --accent-hover: #15803d;
            --border-color: #e5e7eb;
        }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-primary); }
        .card { 
            background-color: var(--bg-secondary); border-radius: 1rem; padding: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.05);
        }
        .form-input, .form-textarea {
            width: 100%; padding: 0.75rem; border: 1px solid var(--border-color);
            border-radius: 0.5rem; font-size: 1rem; background-color: var(--bg-secondary);
        }
        
        .sidebar { transition: width 0.3s ease; }
        .sidebar.collapsed { width: 5rem; }
        .sidebar.collapsed .sidebar-header-text, .sidebar.collapsed .nav-text { display: none; }
        .sidebar.collapsed .nav-button { justify-content: center; }

        #bottom-nav { border-top: 1px solid var(--border-color); }
        .bottom-nav-btn { color: var(--text-secondary); }
        .bottom-nav-btn.active { color: var(--accent-primary); }
        .nav-button.active { background-color: #dcfce7; color: var(--accent-primary); }
        
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content { background-color: white; padding: 2rem; border-radius: 1rem; width: 90%; max-width: 500px; }

        #chat-modal .modal-content {
            height: 70vh; max-width: 450px; padding: 0; display: flex; flex-direction: column;
        }
        #chat-header { padding: 1rem 1.5rem; border-bottom: 1px solid #e5e7eb; font-weight: 700; }
        #chat-messages { flex-grow: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; }
        .chat-bubble { max-width: 80%; padding: 0.5rem 1rem; border-radius: 1rem; margin-bottom: 0.5rem; }
        .chat-bubble.sent { background-color: var(--accent-primary); color: white; align-self: flex-end; border-bottom-right-radius: 0.25rem; }
        .chat-bubble.received { background-color: #e5e7eb; color: var(--text-primary); align-self: flex-start; border-bottom-left-radius: 0.25rem; }
        #chat-form { padding: 1rem; border-top: 1px solid #e5e7eb; display: flex; gap: 0.5rem; }

        @media (max-width: 767px) {
            .sidebar { display: none; }
            #bottom-nav { display: flex; }
            main { padding-bottom: 5rem; } 
        }
        @media (min-width: 768px) {
            #menu-toggle { display: block; }
            #bottom-nav { display: none; }
        }
    </style>

                 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-10 h-10"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"></path></svg>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD7gB7FbMFtG1k1vJGVI3XVCyCUNeZIC7M",
        databaseURL: "https://smart-school-e9f86-default-rtdb.asia-southeast1.firebasedatabase.app",
    };

    // --- APP STATE ---
    let db;
    let student = null;
    let allStudents = [];
    let allStaff = [];
    let allHomework = [];
    let allResults = [];
    let allLiveClasses = [];
    let allBuses = [];
    let allBusTrips = [];
    let allLeaves = [];
    let activeDBListeners = [];
    let currentChatListener = null;
    let countdownIntervalId = null;
    let currentEtaInfo = null;
    let isCountdownPaused = false;
    let pausedRemainingMs = 0;
    let countdownEndTime = 0;
    let outgoingCallRef = null;


    const mainContent = document.getElementById('app-content-container');

    // --- UTILITIES ---
    function showToast(message) {
        const t = document.getElementById('toast');
        if(!t) return;
        t.textContent = message; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }
    
    function logout() {
        cleanupDBListeners();
        sessionStorage.removeItem('loggedInUser');
        student = null;
        document.getElementById('app-container').classList.add('hidden');
        document.getElementById('login-overlay').classList.remove('hidden');
    }

    function cleanupDBListeners() {
        if (countdownIntervalId) {
            clearInterval(countdownIntervalId);
            countdownIntervalId = null;
        }
        currentEtaInfo = null;
        isCountdownPaused = false;
        pausedRemainingMs = 0;
        countdownEndTime = 0;
        
        if (outgoingCallRef) {
            outgoingCallRef.remove();
            outgoingCallRef = null;
        }
        activeDBListeners.forEach(l => l.ref.off(l.type, l.callback));
        activeDBListeners = [];
        if (currentChatListener) {
            currentChatListener.ref.off('value', currentChatListener.callback);
            currentChatListener = null;
        }
    }
    function addDBListener(ref, type, callback) {
        ref.on(type, callback);
        activeDBListeners.push({ ref, type, callback });
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            speechSynthesis.speak(utterance);
        }
    }

    // --- RENDER FUNCTIONS ---
    function renderDashboard() {
        const myHomework = allHomework.filter(h => h.className === student.className && h.section === student.section);
        const newHomeworkCount = myHomework.filter(h => new Date(h.date) > new Date(Date.now() - 7 * 24 * 60 * 60 * 1000)).length; // Homework from last 7 days
        const upcomingClasses = allLiveClasses.filter(lc => lc.className === student.className && lc.section === student.section && lc.status !== 'ended').length;

        mainContent.innerHTML = `
            <div class="space-y-8">
                <div>
                    <h3 class="text-2xl font-bold">Welcome back, ${student.studentName}!</h3>
                    <p class="text-gray-600 mt-1">Class: ${student.className}-${student.section}</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="card bg-yellow-50 border-yellow-200">
                        <h3 class="font-semibold text-yellow-800">New Homework</h3>
                        <p class="text-4xl font-extrabold text-yellow-900 mt-2">${newHomeworkCount}</p>
                    </div>
                    <div class="card bg-blue-50 border-blue-200">
                        <h3 class="font-semibold text-blue-800">Upcoming Classes</h3>
                        <p class="text-4xl font-extrabold text-blue-900 mt-2">${upcomingClasses}</p>
                    </div>
                </div>
            </div>
        `;
    }

    function renderIdCard() {
        mainContent.innerHTML = `
            <div class="max-w-sm mx-auto bg-white rounded-2xl shadow-lg overflow-hidden">
                <div class="bg-green-600 p-4 text-center text-white">
                    <h2 class="text-xl font-bold">Navrose Smart School</h2>
                    <p class="text-sm">Student Identity Card</p>
                </div>
                <div class="p-6 text-center">
                    <div id="qrcode" class="flex justify-center p-4 bg-white border rounded-lg mb-4"></div>
                    <h3 class="text-2xl font-bold">${student.studentName}</h3>
                    <p class="text-gray-600">Admission No: ${student.admissionNumber}</p>
                    <p class="text-gray-600">Class: ${student.className}-${student.section}</p>
                    <p class="text-gray-600">Father's Name: ${student.fatherName}</p>
                    <p class="text-gray-600">Mobile: ${student.mobile}</p>
                </div>
            </div>
        `;
        new QRCode(document.getElementById("qrcode"), { text: student.id, width: 128, height: 128 });
    }
    
    function renderHomework() {
        const myHomework = allHomework
            .filter(h => h.className === student.className && h.section === student.section)
            .sort((a,b) => new Date(b.dueDate) - new Date(a.dueDate));
        
        const homeworkList = myHomework.length > 0 ? myHomework.map(h => `
            <div class="card">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="text-lg font-bold">${h.title}</h3>
                        <p class="text-sm font-semibold text-gray-500">${h.subject}</p>
                    </div>
                    <p class="text-sm text-red-600 font-semibold">Due: ${h.dueDate}</p>
                </div>
                <p class="mt-4 text-gray-700">${h.description}</p>
            </div>
        `).join('') : '<p class="text-center text-gray-500 py-8">No homework assigned.</p>';
        
        mainContent.innerHTML = `<div class="space-y-4">${homeworkList}</div>`;
    }

    function renderTransport() {
        if (!student.transportInfo || !student.transportInfo.busId) {
            mainContent.innerHTML = `<div class="card text-center"><p class="text-gray-600">You are not currently assigned to a bus route. Please contact the transport manager.</p></div>`;
            return;
        }

        mainContent.innerHTML = `
            <div class="card">
                <h3 class="text-xl font-bold mb-4">Live Bus Tracking</h3>
                <div id="transport-status-container" class="space-y-4">
                    <p class="text-center p-8 text-gray-500">Connecting to bus...</p>
                </div>
            </div>
        `;

        const busId = student.transportInfo.busId;
        const bus = allBuses.find(b => b.id === busId);
        
        if (!bus) {
            document.getElementById('transport-status-container').innerHTML = `<p class="text-center p-8 text-red-500">Error: Could not find details for your assigned bus.</p>`;
            return;
        }
        const driverId = bus.assignedDriverId;
        const driver = allStaff.find(s => s.id === driverId);
        
        let liveData = { bus, driver, tripId: null, location: null, boardingInfo: null, dropOffInfo: null, etaInfo: null, liveStatus: 'On Way', tripType: null };
        let innerListeners = [];

        const renderCurrentStatus = () => {
            renderTransportStatus(liveData);
        };

        const cleanupInnerListeners = () => {
            innerListeners.forEach(l => l.ref.off(l.type, l.callback));
            innerListeners = [];
        };

        addDBListener(db.ref(`buses/${busId}/activeTripId`), 'value', tripIdSnap => {
            cleanupInnerListeners();
            if (countdownIntervalId) clearInterval(countdownIntervalId);
            
            const activeTripId = tripIdSnap.val();
            liveData = { ...liveData, tripId: activeTripId, location: null, boardingInfo: null, dropOffInfo: null, etaInfo: null, liveStatus: 'On Way', tripType: null };

            if (!activeTripId) {
                renderCurrentStatus(); 
                return;
            }

            const basePath = db.ref(`busTrips/${activeTripId}`);

            const addInnerListener = (path, key) => {
                const ref = basePath.child(path);
                const callback = snapshot => { liveData[key] = snapshot.val(); renderCurrentStatus(); };
                ref.on('value', callback);
                innerListeners.push({ ref, type: 'value', callback });
            };

            addInnerListener('tripType', 'tripType');
            addInnerListener(`boardedStudents/${student.id}`, 'boardingInfo');
            addInnerListener(`droppedOffStudents/${student.id}`, 'dropOffInfo');
            addInnerListener(`studentETAs/${student.id}`, 'etaInfo');
            addInnerListener('liveStatus', 'liveStatus');

            const locationRef = db.ref(`busLocations/${busId}`);
            const locationCallback = locationSnap => { liveData.location = locationSnap.val(); renderCurrentStatus(); };
            locationRef.on('value', locationCallback);
            innerListeners.push({ ref: locationRef, type: 'value', callback: locationCallback });
            
            const announcementRef = db.ref(`busAnnouncements/${activeTripId}`);
            const announcementCallback = snapshot => {
                const announcement = snapshot.val();
                if (announcement && announcement.message) {
                    showToast(`Bus Announcement: ${announcement.message}`);
                    if (announcement.voice && 'speechSynthesis' in window) {
                        speak(announcement.message);
                    }
                }
            };
            announcementRef.limitToLast(1).on('child_added', announcementCallback);
            innerListeners.push({ ref: announcementRef, type: 'child_added', callback: announcementCallback });
        });
    }

    function renderTransportStatus({ bus, tripId, location, boardingInfo, dropOffInfo, driver, etaInfo, liveStatus, tripType }) {
        const container = document.getElementById('transport-status-container');
        if (!container) return;
    
        const commsHTML = driver ? `<div class="mt-6 flex flex-col md:flex-row gap-4 justify-center">
            <button onclick="openChatWithDriver('${driver.id}', '${driver.staffName}')" class="py-3 px-6 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700">Message Driver</button>
            <button onclick="callDriver('${driver.id}', '${driver.staffName}')" class="py-3 px-6 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700">Call Driver</button>
        </div>` : '';
    
        if (!tripId) {
             container.innerHTML = `
                <p class="text-lg font-semibold">Bus: ${bus.busNumber}</p>
                <p class="text-lg font-semibold">Your Stop: ${student.transportInfo.stopName}</p>
                <div class="mt-4 p-4 bg-gray-100 rounded-lg text-center">
                    <p class="text-2xl font-bold text-gray-700">Trip is not active.</p>
                    <p class="text-gray-500 mt-1">Please check back later.</p>
                </div>
                ${commsHTML}
             `;
             return;
        }

        const tripTypeText = tripType === 'pickup' ? 'Morning Trip (to School)' : 'Afternoon Trip (to Home)';

        container.innerHTML = `
            <p class="text-lg font-semibold">Bus: ${bus.busNumber}</p>
            <p class="text-lg font-semibold">Your Stop: ${student.transportInfo.stopName}</p>
            <div id="live-status-section" class="mt-4 p-4 bg-blue-50 border-blue-200 rounded-lg text-center">
                 <p class="text-lg">Trip Type: <span class="font-bold">${tripTypeText}</span></p>
                 <p class="text-lg">Bus Status: <span id="live-bus-status" class="font-bold">${liveStatus}</span></p>
            </div>
            <div id="eta-section" class="mt-4"></div>
            <div id="boarding-section" class="mt-4"></div>
            ${commsHTML}
        `;

        const etaContainer = document.getElementById('eta-section');
        const boardingContainer = document.getElementById('boarding-section');

        let showCountdown = false;
        let statusHTML = '';
        let boardingHTML = '';

        if (tripType === 'drop') {
            const boardTime = boardingInfo ? new Date(boardingInfo.boardedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
            if (dropOffInfo) {
                const dropTime = new Date(dropOffInfo.droppedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                statusHTML = `<p class="text-2xl font-bold text-blue-800 text-center">Dropped Off Successfully</p><p class="text-gray-600 text-center">At ${dropTime}</p>`;
                boardingHTML = `<p class="text-lg font-semibold text-blue-700 text-center">Trip Completed for you.</p>`;
            } else if (boardingInfo) {
                showCountdown = true;
                boardingHTML = `<p class="text-lg font-semibold text-green-700 text-center">You boarded the bus at ${boardTime}, on the way home.</p>`;
            } else {
                 boardingHTML = `<p class="text-lg font-semibold text-gray-500 text-center">Waiting to board the bus at school.</p>`;
            }
        } else { // pickup
             if (boardingInfo) {
                const boardTime = new Date(boardingInfo.boardedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                statusHTML = `<p class="text-2xl font-bold text-green-800 text-center">Picked Up Successfully</p><p class="text-gray-600 text-center">At ${boardTime}</p>`;
                boardingHTML = `<p class="text-lg font-semibold text-green-700 text-center">On the way to school.</p>`;
            } else {
                showCountdown = true;
                boardingHTML = `<p class="text-lg font-semibold text-gray-500 text-center">Waiting for pickup.</p>`;
            }
        }

        boardingContainer.innerHTML = `<div class="p-4 bg-gray-50 rounded-lg">${boardingHTML}</div>`;
        
        if (showCountdown) {
             if (etaInfo) {
                startCountdown(etaInfo, liveStatus, bus, tripType);
            } else {
                etaContainer.innerHTML = `<div class="text-center p-4 bg-gray-100 rounded-lg"><p class="font-semibold">Waiting for driver to set ETA...</p></div>`;
            }
        } else {
            etaContainer.innerHTML = `<div class="text-center p-4 bg-gray-100 rounded-lg">${statusHTML}</div>`;
        }
    }

    function startCountdown(etaInfo, liveStatus, bus, tripType) {
        if (countdownIntervalId) clearInterval(countdownIntervalId);
        
        const isNewEta = JSON.stringify(etaInfo) !== JSON.stringify(currentEtaInfo);
        currentEtaInfo = etaInfo;
        
        const etaMs = etaInfo.eta * 60 * 1000;
        countdownEndTime = etaInfo.setAt + etaMs;

        const updateTimer = () => {
            if (isCountdownPaused) return;

            const remainingMs = countdownEndTime - Date.now();
            pausedRemainingMs = remainingMs;

            if (remainingMs <= 0) {
                clearInterval(countdownIntervalId);
                countdownIntervalId = null;
                updateCountdownDisplay(0);
                if (!window.spokenArrival) {
                    speak("The bus is arriving now.");
                    window.spokenArrival = true;
                }
            } else {
                updateCountdownDisplay(remainingMs);
                const remainingMinutes = Math.floor(remainingMs / 60000);
                if (remainingMinutes === 2 && !window.spokenTwoMinutes) {
                    speak("The bus is about 2 minutes away.");
                    window.spokenTwoMinutes = true;
                }
            }
        };
        
        if(isNewEta) {
            window.spokenTwoMinutes = false;
            window.spokenArrival = false;
            const arrivalTime = new Date(countdownEndTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const action = tripType === 'pickup' ? 'pick you up at' : 'drop you off at';
            const location = student.transportInfo.stopName || 'your stop';
            speak(`${student.studentName}, please get ready. Bus number ${bus.busNumber} will ${action} ${location}, around ${arrivalTime}.`);
        }

        if (liveStatus !== 'On Way') {
            isCountdownPaused = true;
            pausedRemainingMs = countdownEndTime > Date.now() ? countdownEndTime - Date.now() : 0;
            updateCountdownDisplay(pausedRemainingMs);
        } else {
            isCountdownPaused = false;
            updateTimer();
            countdownIntervalId = setInterval(updateTimer, 1000);
        }
    }

    function updateCountdownDisplay(remainingMs) {
        const etaContainer = document.getElementById('eta-section');
        if (!etaContainer || !currentEtaInfo) return;

        const totalDuration = currentEtaInfo.eta * 60 * 1000;
        const minutes = Math.floor(remainingMs / 60000);
        const seconds = Math.floor((remainingMs % 60000) / 1000);
        const timeString = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        
        const percentRemaining = (remainingMs / totalDuration) * 100;
        let colorClasses = 'bg-green-100 text-green-800';
        if (percentRemaining > 66) {
            colorClasses = 'bg-red-100 text-red-800';
        } else if (percentRemaining > 33) {
            colorClasses = 'bg-yellow-100 text-yellow-800';
        }

        const statusText = isCountdownPaused ? `<p class="font-bold text-yellow-600 text-lg animate-pulse">TIMER PAUSED (Traffic)</p>` : `<p class="font-bold text-gray-600 text-lg">Estimated Arrival In:</p>`;

        etaContainer.innerHTML = `
            <div class="p-6 rounded-lg text-center ${colorClasses}">
                ${statusText}
                <p class="text-6xl font-extrabold tracking-tighter">${timeString}</p>
            </div>
        `;
    }

    async function callDriver(driverId, driverName) {
        if (!student) return;
        const callModal = document.getElementById('call-modal');
        document.getElementById('call-modal-title').textContent = driverName;
        callModal.classList.add('active');

        const callId = `call_${Date.now()}`;
        outgoingCallRef = db.ref(`calls/${driverId}/${callId}`);
        try {
            await outgoingCallRef.set({
                from: student.id,
                fromName: student.studentName,
                timestamp: Date.now()
            });
        } catch(e) {
            showToast("Failed to place call. Check connection.", true);
            endCall();
        }
    }

    function endCall() {
        const callModal = document.getElementById('call-modal');
        callModal.classList.remove('active');
        if (outgoingCallRef) {
            outgoingCallRef.remove();
            outgoingCallRef = null;
        }
    }

    function openChatWithDriver(driverId, driverName) {
        const modal = document.getElementById('chat-modal');
        document.getElementById('chat-header-title').textContent = `Chat with Driver ${driverName}`;
        const messagesContainer = document.getElementById('chat-messages');
        messagesContainer.innerHTML = '';
        modal.classList.add('active');

        const chatId = `${driverId}_${student.id}`;
        const chatRef = db.ref(`chats/${chatId}`);
        
        if (currentChatListener) {
            currentChatListener.ref.off('value', currentChatListener.callback);
        }
        
        const chatCallback = (snapshot) => {
            if (!messagesContainer) return;
            const messages = Object.values(snapshot.val() || {}).sort((a,b) => a.timestamp - b.timestamp);
            messagesContainer.innerHTML = messages.map(msg => {
                return `<div class="chat-bubble ${msg.senderId === student.id ? 'sent' : 'received'}">${msg.text}</div>`;
            }).join('');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        };

        chatRef.on('value', chatCallback);
        currentChatListener = { ref: chatRef, callback: chatCallback };

        const chatForm = document.getElementById('chat-form');
        const newChatForm = chatForm.cloneNode(true);
        chatForm.parentNode.replaceChild(newChatForm, chatForm);

        newChatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const message = {
                senderId: student.id,
                receiverId: driverId,
                text,
                timestamp: Date.now()
            };
            await chatRef.push(message);
            input.value = '';
        });
    }

    function renderLiveClass() {
        mainContent.innerHTML = `<div class="card text-center"><p>Live Class details will appear here.</p></div>`;
    }
    function renderResults() {
        mainContent.innerHTML = `<div class="card text-center"><p>Results will be displayed here.</p></div>`;
    }
    function renderLeaveApplication() {
        mainContent.innerHTML = `<div class="card text-center"><p>Leave Application form will be here.</p></div>`;
    }
    function renderMyProfile() {
        mainContent.innerHTML = `<div class="card text-center"><p>Your profile details will be shown here.</p></div>`;
    }
    
    // --- APP FLOW ---
    const tabs = {
        dashboard: { render: renderDashboard },
        'id-card': { render: renderIdCard },
        homework: { render: renderHomework },
        transport: { render: renderTransport },
        liveclass: { render: renderLiveClass },
        results: { render: renderResults },
        'leave-application': { render: renderLeaveApplication },
        'my-profile': { render: renderMyProfile },
    };

    function setActiveTab(tabName) {
        cleanupDBListeners();

        const pageTitles = {
            dashboard: 'Dashboard', 'id-card': 'My ID Card', homework: 'Homework',
            transport: 'Transport', liveclass: 'Live Class', results: 'Results',
            'leave-application': 'Leave Application', 'my-profile': 'My Profile'
        };
        document.getElementById('page-title').textContent = pageTitles[tabName];
        
        document.querySelectorAll('.nav-button, .bottom-nav-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.tab === tabName);
            if(b.classList.contains('nav-button')) {
                 b.classList.toggle('bg-green-100', b.dataset.tab === tabName);
                 b.classList.toggle('text-green-700', b.dataset.tab === tabName);
            }
        });

        const renderFunction = tabs[tabName]?.render;
        if(renderFunction) renderFunction();
    }

    async function runApp(loggedInUser) {
        document.getElementById('login-overlay').classList.add('hidden');
        document.getElementById('app-container').classList.remove('hidden');

        try {
            const [studentsSnap, staffSnap, homeworkSnap, busesSnap] = await Promise.all([
                db.ref('students').once('value'),
                db.ref('staff').once('value'),
                db.ref('homework').once('value'),
                db.ref('buses').once('value'),
            ]);
            
            allStudents = Object.values(studentsSnap.val() || {});
            allStaff = Object.values(staffSnap.val() || {});
            allHomework = Object.values(homeworkSnap.val() || []);
            allBuses = Object.values(busesSnap.val() || []);

            student = allStudents.find(s => s.id === loggedInUser.id);
            if(!student) {
                logout();
                throw new Error("Student profile not found.");
            }

            document.getElementById('student-info').innerHTML = `<p class="font-semibold">${student.studentName}</p><p class="text-sm text-gray-500">${student.className}-${student.section}</p>`;
            
            document.querySelectorAll('.nav-button, .bottom-nav-btn').forEach(btn => {
                btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
            });
            
            setActiveTab('dashboard');

        } catch (error) {
            console.error("Failed to load data:", error);
            showToast("Could not load required data.");
        }
    }
    
    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.database();

        const form = document.getElementById('student-login-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const admissionNo = document.getElementById('student-admission-no').value;
            const mobile = document.getElementById('student-mobile').value;
            
            try {
                const snapshot = await db.ref('students').orderByChild('admissionNumber').equalTo(admissionNo).once('value');
                if (snapshot.exists()) {
                    const studentData = snapshot.val();
                    const foundStudent = Object.values(studentData).find(s => s.mobile === mobile);
                    
                    if (foundStudent) {
                        const user = { role: 'student', id: foundStudent.id };
                        sessionStorage.setItem('loggedInUser', JSON.stringify(user));
                        runApp(user);
                    } else {
                        showToast('Mobile number does not match.', true);
                    }
                } else {
                    showToast('Admission number not found.', true);
                }
            } catch (err) {
                showToast('Login failed. Check connection.', true);
                console.error(err);
            }
        });
        document.getElementById('logout-btn').addEventListener('click', logout);

        let loggedInUser = null;
        try {
            const userData = sessionStorage.getItem('loggedInUser');
            if (userData) loggedInUser = JSON.parse(userData);
        } catch (e) { sessionStorage.removeItem('loggedInUser'); }
        
        if (loggedInUser && loggedInUser.role === 'student') {
            runApp(loggedInUser);
        }
    });

</script>
