<script>

    // --- APP STATE (GLOBAL) ---

    // --- UTILITIES ---
    function showToast(message) {
        const t = document.getElementById('toast');
        if(!t) return;
        t.textContent = message; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }
    function logout() {
        sessionStorage.removeItem('loggedInUser');
        student = null; homework = []; liveClasses = []; attendanceRecords = []; results = []; announcements = [];
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
        cleanupDBListeners();
        document.getElementById('app-container').classList.add('hidden');
        showLogin();

    function cleanupDBListeners() {
        activeDBListeners.forEach(l => l.ref.off(l.type, l.callback));
        activeDBListeners = [];
    }
    function addDBListener(ref, type, callback) {
        ref.on(type, callback);
        activeDBListeners.push({ ref, type, callback });
    }

    // --- RENDER FUNCTIONS ---
    function renderDashboard() {
        const upcomingHomeworkCount = homework.filter(h => new Date(h.dueDate) >= new Date()).length;
        const totalRecords = attendanceRecords.filter(r => r.attendance && r.attendance[student.id]).length;
        const presentRecords = attendanceRecords.filter(r => r.attendance && r.attendance[student.id] === 'Present').length;
        const attendancePercent = totalRecords > 0 ? ((presentRecords / totalRecords) * 100).toFixed(0) : 100;
        const latestAnnouncement = announcements.sort((a,b) => new Date(b.date) - new Date(a.date))[0];

        mainContent.innerHTML = `
            <div class="space-y-8">
                <div>
                    <h3 class="text-2xl font-bold">Welcome, ${student.studentName}!</h3>
                    <p class="text-gray-600 mt-1">Class: <strong>${student.className} - ${student.section}</strong> | Adm No: <strong>${student.admissionNumber}</strong></p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="card"><h3 class="font-semibold text-gray-500">Upcoming Homework</h3><p class="text-4xl font-extrabold mt-2">${upcomingHomeworkCount}</p></div>
                    <div class="card"><h3 class="font-semibold text-gray-500">Overall Attendance</h3><p class="text-4xl font-extrabold text-green-600 mt-2">${attendancePercent}%</p></div>
                    <div class="card"><h3 class="font-semibold text-gray-500">Recent Grade</h3><p class="text-4xl font-extrabold mt-2">A+</p></div>
                </div>
                ${latestAnnouncement ? `
                <div class="card bg-gray-50">
                    <h4 class="font-bold text-lg mb-2">Latest Announcement</h4>
                    <div class="border-l-4 border-green-500 pl-4">
                        <h5 class="font-bold">${latestAnnouncement.title}</h5>
                        <p class="text-gray-700">${latestAnnouncement.message.substring(0, 150)}...</p>
                    </div>
                </div>` : ''}
            </div>
        `;
    }

    function renderHomework() {
        const sortedHomework = [...homework].sort((a,b) => new Date(b.date) - new Date(a.date));
        mainContent.innerHTML = `<div class="space-y-4">${sortedHomework.map(h => `<div class="card"><h4 class="font-bold text-lg">${h.title} <span class="text-sm font-normal text-gray-500">(${h.subject})</span></h4><p class="text-sm text-gray-500">Assigned: ${new Date(h.date).toLocaleDateString()} | Due: ${h.dueDate}</p><p class="mt-2 whitespace-pre-wrap">${h.description}</p></div>`).join('') || '<div class="card text-center text-gray-500 py-8">No homework found.</div>'}</div>`;
    }
    
    function renderLiveClass() {
        mainContent.innerHTML = `<div id="live-class-list" class="space-y-4"></div>`;
        const container = document.getElementById('live-class-list');

        const liveClassesRef = db.ref('liveClasses');
        addDBListener(liveClassesRef, 'value', (snapshot) => {
            const allClasses = Object.values(snapshot.val() || {});
            const myClasses = allClasses
                .filter(lc => lc.className === student.className && lc.section === student.section)
                .sort((a, b) => new Date(b.date + ' ' + b.startTime) - new Date(a.date + ' ' + a.startTime));

            if (!container) return; 

            const getStatusBadge = (status) => {
                if (status === 'live') return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Live</span>`;
                if (status === 'ended') return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">Ended</span>`;
                return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">Scheduled</span>`;
            };

            container.innerHTML = myClasses.length > 0 ? myClasses.map(lc => {
                const canJoin = lc.status === 'live';
                return `
                <div class="card">
                     <div class="flex justify-between items-center">
                        <div>
                            <h4 class="font-bold text-lg">${lc.topic} <span class="text-base font-medium text-gray-500">(${lc.subject})</span></h4>
                            <p class="text-sm text-gray-500">By ${lc.teacherName} | On: ${lc.date} at ${lc.startTime}</p>
                        </div>
                        <div class="flex items-center gap-4">
                            ${getStatusBadge(lc.status)}
                            <button onclick="joinLiveClass('${lc.id}')" class="bg-green-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-700 disabled:bg-gray-400" ${!canJoin ? 'disabled' : ''}>Join Class</button>
                        </div>
                    </div>
                </div>`
            }).join('') : '<div class="card text-center text-gray-500 py-8">No live classes scheduled for you.</div>';
        });
    }

    async function joinLiveClass(classId) {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            const studentParticipant = { id: student.id, name: student.studentName };
            const classRef = db.ref(`liveClasses/${classId}`);
            
            await classRef.child(`participants/${student.id}`).set(studentParticipant);
            classRef.child(`participants/${student.id}`).onDisconnect().remove();

            renderStudentClassroomView(classId);
            
            const liveClass = liveClasses.find(lc => lc.id === classId);
            initiatePeerConnection(classId, liveClass.teacherId);

        } catch(err) {
            console.error("Error joining class:", err);
            showToast("Could not access camera/microphone. Please check permissions.");
        }
    }

    async function leaveLiveClass(classId) {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        if(peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
        await db.ref(`liveClasses/${classId}/participants/${student.id}`).remove();
        cleanupDBListeners();
        setActiveTab('liveclass');
    }
    
    async function initiatePeerConnection(classId, teacherId) {
        peerConnection = new RTCPeerConnection(rtcConfig);
        
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = event => {
            const teacherVideo = document.getElementById('teacher-video');
            if (teacherVideo) {
                teacherVideo.srcObject = event.streams[0];
                const placeholder = document.querySelector('.teacher-placeholder');
                if (placeholder) placeholder.style.display = 'none';
            }
        };

        const signalingRef = db.ref(`liveClasses/${classId}/signaling/${student.id}`);
        peerConnection.onicecandidate = event => {
            if (event.candidate) {
                signalingRef.child('fromStudent/candidates').push(event.candidate.toJSON());
            }
        };

        addDBListener(signalingRef.child('fromTeacher/offer'), 'value', async (snap) => {
            const offer = snap.val();
            if (offer && peerConnection.signalingState === "stable") {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                await signalingRef.child('fromStudent/answer').set({ type: answer.type, sdp: answer.sdp });
            }
        });

        addDBListener(signalingRef.child('fromTeacher/candidates'), 'child_added', snap => {
            const candidate = snap.val();
            if (candidate) {
                peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            }
        });
    }

    function renderStudentClassroomView(classId) {
        document.getElementById('app-container').classList.add('hidden');
        document.getElementById('bottom-nav').classList.add('hidden');

        const classroomEl = document.createElement('div');
        classroomEl.id = 'classroom-view';
        classroomEl.innerHTML = `

                <div class="flex-1 bg-black flex items-center justify-center relative">
                    <video id="teacher-video" autoplay playsinline class="h-full w-full object-cover"></video>
                    <div class="teacher-placeholder absolute inset-0 flex flex-col items-center justify-center text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-24 h-24 text-gray-700"><path d="M11.7 2.81a.75.75 0 0 1 1.06 0l.47.47.47-.47a.75.75 0 0 1 1.06 0l.47.47.47-.47a.75.75 0 0 1 1.06 0l3.18 3.18a.75.75 0 0 1 0 1.06l-.47.47.47.47a.75.75 0 0 1 0 1.06l-.47.47.47.47a.75.75 0 0 1 0 1.06l-3.18 3.18a.75.75 0 0 1-1.06 0l-.47-.47-.47.47a.75.75 0 0 1-1.06 0l-.47-.47-.47.47a.75.75 0 0 1-1.06 0L8.81 16.2a.75.75 0 0 1 0-1.06l.47-.47-.47-.47a.75.75 0 0 1 0-1.06l.47-.47-.47-.47a.75.75 0 0 1 0-1.06l3.18-3.18Z" /></svg>
                        <h3 class="text-xl font-bold mt-4">Waiting for teacher's video...</h3>
                    </div>
                    <div class="absolute bottom-4 right-4 w-32 h-24 md:w-48 md:h-36 rounded-lg overflow-hidden border-2 border-white/50">
                        <video id="my-video" autoplay playsinline muted class="h-full w-full object-cover transform -scale-x-100"></video>
                    </div>
                    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-black/50 p-3 rounded-full flex gap-4">
                        <button id="mic-btn" class="control-btn"><svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8.25 4.5a3.75 3.75 0 1 1 7.5 0v8.25a3.75 3.75 0 1 1-7.5 0V4.5Z" /><path d="M6 15a.75.75 0 0 1 .75.75v.008c0 3.036 2.464 5.5 5.5 5.5s5.5-2.464 5.5-5.5v-.008a.75.75 0 0 1 1.5 0v.008a7 7 0 0 1-7 7s-7-3.134-7-7v-.008A.75.75 0 0 1 6 15Z" /></svg></button>
                        <button id="video-btn" class="control-btn"><svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M4.5 4.5a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h8.25a3 3 0 0 0 3-3v-2.845l3.52 1.87a.75.75 0 0 0 1.23-.654V8.13a.75.75 0 0 0-1.23-.655L15.75 9.345V7.5a3 3 0 0 0-3-3H4.5Z" /></svg></button>
                        <button id="leave-class-btn" class="control-btn danger"><svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10.25 5.25a.75.75 0 0 0-1.5 0v4.32L6.873 7.72a.75.75 0 0 0-1.054 1.07l1.9 1.85-1.9 1.85a.75.75 0 1 0 1.054 1.07L8.75 11.68v4.57a.75.75 0 0 0 1.5 0v-4.57l1.877 1.82a.75.75 0 1 0 1.054-1.07l-1.9-1.85 1.9-1.85a.75.75 0 0 0-1.054-1.07L10.25 9.57V5.25Z" /></svg></button>
                    </div>
                </div>
                <div class="w-full md:w-80 bg-gray-900 text-white flex flex-col">
                     <div class="p-3 border-b border-gray-700">Chat</div>
                     <div id="chat-messages" class="p-3 flex-1 overflow-y-auto flex flex-col-reverse"></div>
                     <form id="chat-form" class="p-3 border-t border-gray-700 flex gap-2"><input type="text" id="chat-input-field" class="bg-gray-800 text-white rounded p-2 flex-1" placeholder="Type..." required><button type="submit" class="bg-green-600 rounded p-2">Send</button></form>
                </div>
            </div>`;
        document.body.appendChild(classroomEl);

        document.getElementById('my-video').srcObject = localStream;
        document.getElementById('leave-class-btn').onclick = () => {
            leaveLiveClass(classId);
            document.getElementById('classroom-view').remove();
            document.getElementById('app-container').classList.remove('hidden');
        };
        
        cleanupDBListeners();

        const chatRef = db.ref(`liveClasses/${classId}/chat`);
        addDBListener(chatRef, 'child_added', snap => {
            const msg = snap.val();
            const chatBox = document.getElementById('chat-messages');
            if (!chatBox) return;
            // Chat messages are appended, so we insert at the top for reverse column layout
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('chat-message', 'mb-2', msg.senderId === student.id ? 'self' : 'other');
            msgDiv.innerHTML = `<div class="font-bold text-sm">${msg.senderName}</div><div>${msg.text}</div>`;
            chatBox.insertBefore(msgDiv, chatBox.firstChild);
        });

        const statusRef = db.ref(`liveClasses/${classId}/status`);
        addDBListener(statusRef, 'value', snap => {
            if (snap.val() === 'ended') {
                showToast("The teacher has ended the class.");
                leaveLiveClass(classId);
            }
        });
        
        document.getElementById('chat-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input-field');
            const text = input.value.trim();
            if (text) {
                db.ref(`liveClasses/${classId}/chat`).push({ senderId: student.id, senderName: student.studentName, text, timestamp: firebase.database.ServerValue.TIMESTAMP });
                input.value = '';
            }
        });

        document.getElementById('mic-btn').addEventListener('click', (e) => {
            localStream.getAudioTracks().forEach(track => track.enabled = !track.enabled);
            e.currentTarget.style.backgroundColor = localStream.getAudioTracks()[0].enabled ? 'rgba(255,255,255,0.2)' : '#f87171';
        });
        document.getElementById('video-btn').addEventListener('click', (e) => {
            localStream.getVideoTracks().forEach(track => track.enabled = !track.enabled);
            e.currentTarget.style.backgroundColor = localStream.getVideoTracks()[0].enabled ? 'rgba(255,255,255,0.2)' : '#f87171';
        });
    }

    function renderAttendance() {
        const today = new Date();
        let currentMonth = today.getMonth();
        let currentYear = today.getFullYear();
        
        mainContent.innerHTML = `
            <div class="card">
                 <div id="calendar-header" class="flex justify-between items-center mb-4">
                    <button id="prev-month" class="p-2 rounded-full hover:bg-gray-100">&lt;</button>
                    <h3 id="month-year" class="text-xl font-bold"></h3>
                    <button id="next-month" class="p-2 rounded-full hover:bg-gray-100">&gt;</button>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center"></div>
                <div class="flex justify-center gap-4 mt-4 text-sm"><span class="flex items-center gap-2"><div class="w-3 h-3 bg-green-200 rounded-full"></div>Present</span><span class="flex items-center gap-2"><div class="w-3 h-3 bg-red-200 rounded-full"></div>Absent</span><span class="flex items-center gap-2"><div class="w-3 h-3 bg-yellow-200 rounded-full"></div>Leave</span></div>
            </div>
        `;

        const updateCalendar = () => generateCalendar(currentYear, currentMonth);

        document.getElementById('prev-month').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            updateCalendar();
        });
        document.getElementById('next-month').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            updateCalendar();
        });

        updateCalendar();
    }

    function generateCalendar(year, month) {
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        document.getElementById('month-year').textContent = `${monthNames[month]} ${year}`;
        
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        
        ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach(day => {
            grid.innerHTML += `<div class="font-semibold text-sm text-gray-500 p-2">${day}</div>`;
        });

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
            grid.innerHTML += '<div></div>';
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const record = attendanceRecords.find(r => r.date === dateStr);
            const status = record?.attendance?.[student.id];
            
            let statusClass = 'bg-gray-100';
            if(status === 'Present') statusClass = 'bg-green-200';
            else if(status === 'Absent') statusClass = 'bg-red-200';
            else if(status === 'Leave') statusClass = 'bg-yellow-200';
            
            grid.innerHTML += `<div class="p-2 rounded-full ${statusClass}">${day}</div>`;
        }
    }

    function renderResults() {
        mainContent.innerHTML = `<div class="space-y-4">${results.map(res => `<div class="card"><h4 class="font-bold text-lg">${res.examType}</h4><div class="overflow-x-auto mt-2"><table class="w-full text-sm"><thead><tr class="border-b"><th class="p-2 text-left">Subject</th><th class="p-2 text-right">Marks (100)</th></tr></thead><tbody>${Object.entries(res.results[student.id] || {}).map(([sub, marks]) => `<tr><td class="p-2">${sub}</td><td class="p-2 text-right font-semibold">${marks}</td></tr>`).join('')}</tbody></table></div></div>`).join('') || '<div class="card text-center text-gray-500 py-8">No results have been published yet.</div>'}</div>`;
    }

    function renderDiary() {
        const sortedAnnouncements = [...announcements].sort((a,b) => new Date(b.date) - new Date(a.date));
        mainContent.innerHTML = `<div class="space-y-4">${sortedAnnouncements.map(a => `<div class="card"><h4 class="font-bold text-lg">${a.title}</h4><p class="text-sm text-gray-500">Posted on: ${new Date(a.date).toLocaleDateString()}</p><p class="mt-2 whitespace-pre-wrap">${a.message}</p></div>`).join('') || '<div class="card text-center text-gray-500 py-8">No announcements found.</div>'}</div>`;
    }

    function renderMyIDCard() {
        mainContent.innerHTML = `
            <div class="max-w-md mx-auto card text-center">
                 <h3 class="text-2xl font-bold">${student.studentName}</h3>
                 <p class="text-gray-600">Class: ${student.className} - ${student.section}</p>
                 <p class="text-gray-600 mb-6">Admission No: ${student.admissionNumber}</p>
                 <div id="qrcode" class="flex justify-center p-4 bg-white border rounded-lg"></div>
                 <p class="mt-4 text-sm text-gray-500">Show this QR code to your teacher for attendance.</p>
            </div>
        `;

        new QRCode(document.getElementById("qrcode"), {
            text: student.id,
            width: 256,
            height: 256,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    }

    // --- APP FLOW & NAVIGATION ---
    function setActiveTab(tabName) {
        cleanupDBListeners();
        const pageTitles = { dashboard: 'Dashboard', 'id-card': 'My ID Card', homework: 'Homework', liveclass: 'Live Classes', attendance: 'My Attendance', results: 'My Results', diary: 'School Diary' };
        document.getElementById('page-title').textContent = pageTitles[tabName];
        
        // Sidebar
        document.querySelectorAll('.sidebar .nav-button').forEach(b => {
            const isActive = b.dataset.tab === tabName;
            b.classList.toggle('bg-green-100', isActive);
            b.classList.toggle('text-green-700', isActive);
        });

        // Bottom Nav
        document.querySelectorAll('#bottom-nav button').forEach(b => {
            b.classList.toggle('active', b.dataset.tab === tabName);
        });

        const renderFunction = { dashboard: renderDashboard, 'id-card': renderMyIDCard, homework: renderHomework, liveclass: renderLiveClass, attendance: renderAttendance, results: renderResults, diary: renderDiary }[tabName];
        if(renderFunction) renderFunction();
    }

    function initResponsiveUI() {
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.querySelector('.sidebar');
        
        const collapseIcon = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-gray-600"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" /></svg>`;
        const expandIcon = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-gray-600"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" /></svg>`;

        menuToggle.innerHTML = collapseIcon;
        
        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            const isCollapsed = sidebar.classList.contains('collapsed');
            menuToggle.innerHTML = isCollapsed ? expandIcon : collapseIcon;
        });

        document.querySelectorAll('.nav-button, .bottom-nav-btn').forEach(btn => {
            btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
        });
    }
    
    async function runApp(loggedInUser) {
        document.getElementById('login-overlay').classList.add('hidden');
        document.getElementById('app-container').classList.remove('hidden');
        mainContent.innerHTML = `<div class="text-center p-8"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-green-600 mx-auto"></div><p class="mt-4 text-gray-600">Loading your data...</p></div>`;
        
        try {
            const studentsSnap = await db.ref('students').once('value');
            student = Object.values(studentsSnap.val() || {}).find(s => s.id === loggedInUser.id);
            if (!student) { logout(); throw new Error('Student profile not found.'); }
            
            const [homeworkSnap, liveClassesSnap, attendanceSnap, resultsSnap, announcementsSnap] = await Promise.all([
                db.ref('homework').orderByChild('className').equalTo(student.className).once('value'),
                db.ref('liveClasses').orderByChild('className').equalTo(student.className).once('value'),
                db.ref('attendance').orderByChild('className').equalTo(student.className).once('value'),
                db.ref('results').orderByChild('className').equalTo(student.className).once('value'),
                db.ref('announcements').once('value')
            ]);
            
            const filterBySection = (snap) => Object.values(snap.val() || {}).filter(item => item.section === student.section);
            
            homework = filterBySection(homeworkSnap);
            liveClasses = filterBySection(liveClassesSnap);
            attendanceRecords = filterBySection(attendanceSnap);
            results = filterBySection(resultsSnap);
            announcements = Object.values(announcementsSnap.val() || {});

            document.getElementById('student-info').innerHTML = `<p class="font-semibold">${student.studentName}</p><p class="text-sm text-gray-500">Class ${student.className}-${student.section}</p>`;
            document.getElementById('logout-btn').addEventListener('click', logout);
            initResponsiveUI();
            setActiveTab('dashboard');

        } catch (error) {
            console.error("Failed to load student data:", error);
            mainContent.innerHTML = `<div class="card text-red-700 bg-red-100"><h3 class="font-bold">Error</h3><p>Could not load your data. Please log out and try again.</p></div>`;
        }
    }

    function showLogin() {
        document.getElementById('login-overlay').classList.remove('hidden');
    }

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.database();

        const form = document.getElementById('student-login-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const admissionNo = document.getElementById('student-admission-no').value;
            const mobile = document.getElementById('student-mobile').value;
            const button = form.querySelector('button[type="submit"]');
            button.disabled = true;
            button.textContent = 'Verifying...';
            
            try {
                const studentsSnap = await db.ref('students').once('value');
                const allStudents = Object.values(studentsSnap.val() || {});
                const foundStudent = allStudents.find(s => s.admissionNumber === admissionNo && s.mobile === mobile);
                
                if (foundStudent) {
                    const user = { role: 'student', id: foundStudent.id };
                    sessionStorage.setItem('loggedInUser', JSON.stringify(user));
                    runApp(user);
                } else {
                    showToast('Invalid Admission No. or Mobile No.');
                }
            } catch (err) {
                showToast('Login failed. Check connection.');
                console.error(err);
            } finally {
                button.disabled = false;
                button.textContent = 'Login';
            }
        });
        
        let loggedInUser = null;
        try {
            const userData = sessionStorage.getItem('loggedInUser');
            if (userData) loggedInUser = JSON.parse(userData);
        } catch (e) {
            sessionStorage.removeItem('loggedInUser');
        }
        
        if (loggedInUser && loggedInUser.role === 'student') {
            runApp(loggedInUser);
        } else {
            showLogin();
        }
    });

</script>
